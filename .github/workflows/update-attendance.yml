name: Update Attendance

on:
  schedule:
    # Run every 2 hours to capture updates from multiple shops.
    # GitHub schedules are UTC. 15 past the hour is used to avoid peak traffic.
    - cron: "15 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-attendance:
    runs-on: ubuntu-latest
    steps:
      - name: Check Tailscale config
        id: tailscale-config
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TAILSCALE_EXIT_NODE: ${{ secrets.TAILSCALE_EXIT_NODE }}
        run: |
          missing=0
          for name in TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET TAILSCALE_EXIT_NODE; do
            if [ -z "${!name}" ]; then
              echo "::notice::$name is not configured; attendance update will be skipped."
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip attendance update
        if: steps.tailscale-config.outputs.configured != 'true'
        run: echo "Tailscale exit-node secrets are not configured yet."
      - uses: actions/checkout@v4
        if: steps.tailscale-config.outputs.configured == 'true'
      - name: Connect to Tailscale
        if: steps.tailscale-config.outputs.configured == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          # Keep the GitHub runner resolver; tailnet DNS can break public lookups after selecting this exit node.
          args: --exit-node=${{ secrets.TAILSCALE_EXIT_NODE }} --exit-node-allow-lan-access --accept-dns=false
      - name: Verify Tailscale exit node
        if: steps.tailscale-config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          echo "DNS resolver configuration:"
          resolvectl status || cat /etc/resolv.conf
          echo
          echo "Source host resolution:"
          for host in tokyo-weimi.com hikari888.com vip6969.com; do
            getent hosts "$host"
          done
          echo
          echo "Public IP through exit node:"
          curl --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 10 -sS https://ifconfig.me || echo "::warning::Unable to read public IP through exit node."
          echo
          curl --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 10 -L -sS -o /dev/null -w "tokyo-weimi status=%{http_code} final_url=%{url_effective}\n" https://tokyo-weimi.com/
      - uses: pnpm/action-setup@v4
        if: steps.tailscale-config.outputs.configured == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: steps.tailscale-config.outputs.configured == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.tailscale-config.outputs.configured == 'true'
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.tailscale-config.outputs.configured == 'true'
      - run: pnpm run attendance:update
        if: steps.tailscale-config.outputs.configured == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || secrets.DEEPSEEK_MODEL }}
      - run: pnpm run typecheck
        if: steps.tailscale-config.outputs.configured == 'true'
      - run: pnpm test
        if: steps.tailscale-config.outputs.configured == 'true'
      - run: pnpm run build
        if: steps.tailscale-config.outputs.configured == 'true'
      - run: pnpm run test:e2e
        if: steps.tailscale-config.outputs.configured == 'true'
      - name: Create pull request
        if: steps.tailscale-config.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/content public/assets/old-site docs package.json; then
            echo "No attendance changes detected."
            exit 0
          fi

          branch="automation/update-attendance-$(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add src/content/site-data.json src/content/image-map.json src/content/image-map.ts src/content/local-image-map.json src/content/profile-translations.json
          if compgen -G "public/assets/old-site/today-*" > /dev/null; then
            git add -f public/assets/old-site/today-*
          fi
          git status --short
          git commit -m "Update attendance for $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git fetch origin "$branch" 2>/dev/null || true
          git push --force-with-lease origin "$branch"

          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "Pull request already exists for $branch."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$branch" \
            --title "Update attendance for $(TZ=Asia/Tokyo date +%Y-%m-%d)" \
            --body "Automated daily multi-shop attendance refresh from https://tokyo-weimi.com/ and https://hikari888.com/."
