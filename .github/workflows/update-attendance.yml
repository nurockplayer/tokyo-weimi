name: Update Attendance

on:
  schedule:
    # Run every 2 hours to capture updates from multiple shops.
    # GitHub schedules are UTC. 15 past the hour is used to avoid peak traffic.
    - cron: "15 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-attendance:
    runs-on: ubuntu-latest
    steps:
      - name: Check Tailscale config
        id: tailscale-config
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TAILSCALE_EXIT_NODE: ${{ secrets.TAILSCALE_EXIT_NODE }}
        run: |
          missing=0
          for name in TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET TAILSCALE_EXIT_NODE; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured; attendance update cannot proceed."
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Abort on missing Tailscale config
        if: steps.tailscale-config.outputs.configured != 'true'
        run: |
          echo "::error::Required Tailscale secrets are missing. Attendance update cannot proceed."
          echo "Expected: TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET, TAILSCALE_EXIT_NODE"
          echo "Check repository secrets in Settings → Secrets and variables → Actions."
          exit 1
      - uses: actions/checkout@v4
        if: steps.tailscale-config.outputs.configured == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.tailscale-config.outputs.configured == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: steps.tailscale-config.outputs.configured == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.tailscale-config.outputs.configured == 'true'
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.tailscale-config.outputs.configured == 'true'
      - name: Connect to Tailscale
        if: steps.tailscale-config.outputs.configured == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --accept-dns=false
      - name: Gate on exit node connectivity
        id: gate
        if: steps.tailscale-config.outputs.configured == 'true'
        env:
          TAILSCALE_EXIT_NODE: ${{ secrets.TAILSCALE_EXIT_NODE }}
        run: |
          set -u -o pipefail

          SOURCE_HOSTS=(tokyo-weimi.com hikari888.com vip6969.com)
          NODES=()

          while IFS= read -r raw_node; do
            node="$(printf '%s' "$raw_node" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
            [ -z "$node" ] && continue
            if [[ "$node" =~ [[:space:]] ]]; then
              echo "::warning::Ignoring malformed exit-node entry containing internal whitespace."
              continue
            fi
            NODES+=("$node")
          done <<< "${TAILSCALE_EXIT_NODE:-}"

          if [ "${#NODES[@]}" -eq 0 ]; then
            echo "::error::No valid Tailscale exit nodes configured."
            exit 1
          fi

          for i in "${!NODES[@]}"; do
            node="${NODES[$i]}"
            label="exit node #$((i + 1))"

            echo "::group::Probe ${label}"

            if ! sudo tailscale set \
              --exit-node="$node" \
              --exit-node-allow-lan-access=true \
              --accept-dns=false; then
              echo "::warning::Unable to select ${label}."
              echo "::endgroup::"
              continue
            fi

            for delay in 2 4 6; do
              sleep "$delay"

              for host in "${SOURCE_HOSTS[@]}"; do
                status="$(curl --connect-timeout 8 --max-time 12 -L -sS -o /dev/null -w "%{http_code}" "https://${host}/" || true)"
                if [[ "$status" =~ ^[23] ]]; then
                  echo "${host} reachable via ${label}"
                  echo "::endgroup::"
                  exit 0
                fi
                echo "${host} not reachable via ${label}; status=${status}"
              done
            done

            echo "::warning::${label} selected but did not reach any source host."
            echo "::endgroup::"
          done

          echo "::error::All configured Tailscale exit nodes are unable to reach source sites."
          exit 1
      - run: pnpm run attendance:update
        if: steps.tailscale-config.outputs.configured == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || secrets.DEEPSEEK_MODEL }}
      - run: pnpm run typecheck
        if: steps.tailscale-config.outputs.configured == 'true'
      - run: pnpm test
        if: steps.tailscale-config.outputs.configured == 'true'
      - run: pnpm run build
        if: steps.tailscale-config.outputs.configured == 'true'
      - run: pnpm run test:e2e
        if: steps.tailscale-config.outputs.configured == 'true'
      - name: Create pull request
        if: steps.tailscale-config.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/content public/assets/old-site docs package.json; then
            echo "No attendance changes detected."
            exit 0
          fi

          branch="automation/update-attendance-$(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add src/content/site-data.json src/content/image-map.json src/content/image-map.ts src/content/local-image-map.json src/content/profile-translations.json
          if compgen -G "public/assets/old-site/today-*" > /dev/null; then
            git add -f public/assets/old-site/today-*
          fi
          git status --short
          git commit -m "Update attendance for $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git fetch origin "$branch" 2>/dev/null || true
          git push --force-with-lease origin "$branch"

          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "Pull request already exists for $branch."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$branch" \
            --title "Update attendance for $(TZ=Asia/Tokyo date +%Y-%m-%d)" \
            --body "Automated daily multi-shop attendance refresh from https://tokyo-weimi.com/ and https://hikari888.com/."
