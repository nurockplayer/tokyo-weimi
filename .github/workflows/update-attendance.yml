name: Update Attendance

on:
  schedule:
    # Run 4 times daily (every 6 hours) to capture cross-shop updates.
    # UTC 03:15 / 09:15 / 15:15 / 21:15
    # JST 12:15 / 18:15 / 00:15 / 06:15
    - cron: "15 3,9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-attendance:
    runs-on: ubuntu-latest
    steps:
      - name: Check Tailscale config
        id: tailscale-config
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TAILSCALE_EXIT_NODE: ${{ secrets.TAILSCALE_EXIT_NODE }}
        run: |
          missing=0
          for name in TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET TAILSCALE_EXIT_NODE; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured; attendance update cannot proceed."
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Abort on missing Tailscale config
        if: steps.tailscale-config.outputs.configured != 'true'
        run: |
          echo "::error::Required Tailscale secrets are missing. Attendance update cannot proceed."
          echo "Expected: TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET, TAILSCALE_EXIT_NODE"
          echo "Check repository secrets in Settings → Secrets and variables → Actions."
          exit 1
      - uses: actions/checkout@v4
        if: steps.tailscale-config.outputs.configured == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.tailscale-config.outputs.configured == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: steps.tailscale-config.outputs.configured == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.tailscale-config.outputs.configured == 'true'
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.tailscale-config.outputs.configured == 'true'
      - name: Connect to Tailscale
        if: steps.tailscale-config.outputs.configured == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --accept-dns=false
      - name: Gate on exit node connectivity
        id: gate
        if: steps.tailscale-config.outputs.configured == 'true'
        env:
          TAILSCALE_EXIT_NODE: ${{ secrets.TAILSCALE_EXIT_NODE }}
        run: |
          set -u -o pipefail

          echo "=== Public IP before Tailscale exit node ==="
          curl -sS --connect-timeout 8 --max-time 12 https://ifconfig.me || echo "(unreachable)"

          echo "=== Tailscale status before exit node ==="
          sudo tailscale status 2>&1 | head -20 || true

          SOURCE_HOSTS=(tokyo-weimi.com hikari888.com vip6969.com)
          NODES=()

          while IFS= read -r raw_node; do
            node="$(printf '%s' "$raw_node" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
            [ -z "$node" ] && continue
            if [[ "$node" =~ [[:space:]] ]]; then
              echo "::warning::Ignoring malformed exit-node entry containing internal whitespace."
              continue
            fi
            NODES+=("$node")
          done <<< "${TAILSCALE_EXIT_NODE:-}"

          if [ "${#NODES[@]}" -eq 0 ]; then
            echo "::error::No valid Tailscale exit nodes in TAILSCALE_EXIT_NODE secret."
            echo "Check that the secret is set in Settings > Secrets and variables > Actions."
            exit 1
          fi

          for i in "${!NODES[@]}"; do
            node="${NODES[$i]}"
            label="exit node #$((i + 1))"

            echo "::group::Probe ${label}"

            echo "Attempting: sudo tailscale set --exit-node=... --exit-node-allow-lan-access=true --accept-dns=false"
            ts_stderr="$(mktemp)"
            if sudo tailscale set \
              --exit-node="$node" \
              --exit-node-allow-lan-access=true \
              --accept-dns=false \
              2>"$ts_stderr"; then
              echo "tailscale set succeeded for ${label}."
            else
              ts_err="$(cat "$ts_stderr")"
              rm -f "$ts_stderr"
              echo "::warning::tailscale set FAILED for ${label}."
              if [ -n "$ts_err" ]; then
                echo "tailscale set stderr: ${ts_err}"
              fi
              echo "Possible causes:"
              echo "  1. Node '$node' is offline or not in the tailnet"
              echo "  2. Node '$node' does not advertise exit-node capability"
              echo "  3. Exit node is not approved in Tailscale admin console"
              echo "  4. tag:ci ACL does not permit using this exit node"
              if echo "$ts_err" | grep -q "not advertising"; then
                echo ""
                echo "Node '$node' is online but not advertising exit-node capability."
                echo "Possible GL.iNet state drift: re-apply --advertise-exit-node on the AXT1800"
                echo "and approve it in Tailscale admin."
                echo "Do not switch to tachinas for this workflow."
              fi
              echo "Diagnose: run 'sudo tailscale status' and verify the node is online and lists 'exit node:'"
              echo "Fix: https://tailscale.com/kb/1103/exit-nodes"
              echo "::endgroup::"
              continue
            fi
            rm -f "$ts_stderr"

            echo "Tailscale status after selecting exit node:"
            sudo tailscale status 2>&1 | head -20 || true

            echo "Public IP after exit node (waiting for route to establish):"
            for delay in 2 4 6; do
              sleep "$delay"
              public_ip="$(curl -sS --connect-timeout 8 --max-time 12 https://ifconfig.me || true)"
              if [ -n "$public_ip" ]; then
                echo "  ${delay}s: ${public_ip}"
              else
                echo "  ${delay}s: (no response)"
              fi
            done

            echo "Probing source hosts:"
            reached_any=false
            for host in "${SOURCE_HOSTS[@]}"; do
              status="$(curl --connect-timeout 8 --max-time 12 -L -sS -o /dev/null -w "%{http_code}" "https://${host}/" 2>&1 || true)"
              if [[ "$status" =~ ^[23] ]]; then
                echo "  ${host} → HTTP ${status} ✓"
                reached_any=true
              else
                echo "  ${host} → HTTP ${status} ✗"
              fi
            done

            if [ "$reached_any" = true ]; then
              echo "Source site reachable via ${label}."
              echo "::endgroup::"
              exit 0
            fi

            echo "::warning::${label} selected but no source host was reachable."
            echo "::endgroup::"
          done

          echo "::error::All configured Tailscale exit nodes are unable to reach source sites."
          echo "Run Source Diagnostics workflow for detailed troubleshooting."
          exit 1
      - run: pnpm run attendance:update
        if: steps.tailscale-config.outputs.configured == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || secrets.DEEPSEEK_MODEL }}
      - run: pnpm run typecheck
        if: steps.tailscale-config.outputs.configured == 'true'
      - run: pnpm test
        if: steps.tailscale-config.outputs.configured == 'true'
      - run: pnpm run build
        if: steps.tailscale-config.outputs.configured == 'true'
      - run: pnpm run test:e2e
        if: steps.tailscale-config.outputs.configured == 'true'
      - name: Create pull request
        if: steps.tailscale-config.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/content public/assets/old-site docs package.json; then
            echo "No attendance changes detected."
            exit 0
          fi

          branch="automation/update-attendance-$(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add src/content/site-data.json src/content/image-map.json src/content/image-map.ts src/content/local-image-map.json src/content/profile-translations.json
          if compgen -G "public/assets/old-site/today-*" > /dev/null; then
            git add -f public/assets/old-site/today-*
          fi
          git status --short
          git commit -m "Update attendance for $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git fetch origin "$branch" 2>/dev/null || true
          git push --force-with-lease origin "$branch"

          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "Pull request already exists for $branch."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$branch" \
            --title "Update attendance for $(TZ=Asia/Tokyo date +%Y-%m-%d)" \
            --body "Automated daily multi-shop attendance refresh from https://tokyo-weimi.com/ and https://hikari888.com/."
