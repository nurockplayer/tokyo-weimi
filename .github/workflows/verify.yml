name: Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run content:check-contract-failures
      - name: Check content contract (allowed to fail on known duplicate ID)
        id: content-contract
        run: pnpm run content:check-contract
        continue-on-error: true
      - name: Verify contract check only fails on expected duplicate ID
        if: steps.content-contract.outcome == 'failure'
        run: |
          OUTPUT="$(pnpm run content:check-contract 2>&1)" || true
          if echo "$OUTPUT" | grep -qE "has duplicate id: ikebukuro-vip-girl-vip-e[58][a-f0-9]+"; then
            echo "::warning::content:check-contract blocked by known duplicate IDs (see #92)"
          else
            echo "$OUTPUT"
            echo "::error::content:check-contract failed for an unexpected reason"
            exit 1
          fi
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
