name: Source Diagnostics

on:
  workflow_dispatch:

jobs:
  diagnose-source:
    runs-on: ubuntu-latest
    steps:
      - name: Show runner public IP
        run: |
          echo "Public IP before Tailscale:"
          curl -sS https://ifconfig.me || true
          echo
      - name: Validate Tailscale config
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TAILSCALE_EXIT_NODES: ${{ secrets.TAILSCALE_EXIT_NODES }}
        run: |
          missing=0
          for name in TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET TAILSCALE_EXIT_NODES; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for source diagnostics."
              missing=1
            fi
          done
          exit "$missing"
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --accept-dns=false
      - name: Try exit nodes and verify
        env:
          TAILSCALE_EXIT_NODES: ${{ secrets.TAILSCALE_EXIT_NODES }}
        run: |
          set -u -o pipefail
          NODES=()
          while IFS= read -r raw_node; do
            node="$(printf '%s' "$raw_node" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
            [ -z "$node" ] && continue
            NODES+=("$node")
          done <<< "${TAILSCALE_EXIT_NODES:-}"

          if [ "${#NODES[@]}" -eq 0 ]; then
            echo "::error::No valid exit nodes in TAILSCALE_EXIT_NODES"
            exit 1
          fi

          for i in "${!NODES[@]}"; do
            node="${NODES[$i]}"
            echo "::group::Exit node #$((i + 1)): ${node}"
            sudo tailscale set --exit-node="$node" --exit-node-allow-lan-access=true --accept-dns=false || true
            sleep 4
            echo "Public IP through exit node:"
            curl -sS --connect-timeout 8 --max-time 12 https://ifconfig.me || true
            echo
            echo "::endgroup::"
          done
      - name: Diagnose source endpoints
        run: |
          set -u
          for url in \
            "https://tokyo-weimi.com/" \
            "https://tokyo-weimi.com/wp-json/wp/v2/posts?per_page=5" \
            "https://tokyo-weimi.com/wp-json/wp/v2/posts/26846" \
            "https://tokyo-weimi.com/girls/26846" \
            "https://tokyo-weimi.com/?p=26846" \
            "https://hikari888.com/" \
            "https://hikari888.com/1020/" \
            "https://vip6969.com/" \
            "https://vip6969.com/system/"; do
            echo "::group::$url"
            curl -L -sS -o /tmp/response.txt -w "status=%{http_code} content_type=%{content_type} size=%{size_download} final_url=%{url_effective}\n" "$url" || true
            head -c 500 /tmp/response.txt || true
            echo
            echo "::endgroup::"
          done
